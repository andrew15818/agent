[project]
name = "agent"
version = "0.1.0"
description = "AI agent that plays chess"
authors = [{ name = "Andres Ponce", email = "andreseeponce@gmail.com" }]
requires-python = ">=3.13,<4"
readme = "README.md"
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
]
dependencies = [
  "fastapi[standard]>=0.115.12,<0.116",
  "google-genai>=1.18.0,<2",
  "logging>=0.4.9.6,<0.5",
  "python-dotenv>=1.1.0,<2",
  "langchain[google-genai]==1.3.0",
  "python-chess>=1.999,<2",
  "langchain-mistralai>=0.2.10,<0.3",
  "gradio>=5.35.0,<6",
  "langchain-ollama>=1.1.0",
]

[dependency-groups]
dev = ["pytest>=8.4.0,<9", "pytest-mock>=3.14.1,<4"]

[tool.uv]
default-groups = "all"
package = false

[build-system]
requires = ["uv_build>=0.9.26,<0.10.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module_name = "app"
module-root = ""
